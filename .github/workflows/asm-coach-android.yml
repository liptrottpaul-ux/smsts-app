name: ASM Coach Android

on:
  push:
    paths:
      - "asm-coach/**"
      - ".github/workflows/asm-coach-android.yml"
  pull_request:
    paths:
      - "asm-coach/**"
  workflow_dispatch:

concurrency:
  group: asm-coach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: asm-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asm-coach-debug-apk
          path: asm-coach/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/asm-coach.apk

      # A release gives a single, phone-friendly download link for the APK.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asm-coach-build-${{ github.run_number }}
          name: ASM Coach build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Debug build of ASM Coach from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **asm-coach.apk** below on your Android phone and open it to install.
          files: asm-coach/app/build/outputs/apk/debug/asm-coach.apk
