name: ASM Coach Android

on:
  push:
    paths:
      - "asm-coach/**"
      - ".github/workflows/asm-coach-android.yml"
  pull_request:
    paths:
      - "asm-coach/**"
  workflow_dispatch:

concurrency:
  group: asm-coach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asm-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asm-coach-debug-apk
          path: asm-coach/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
